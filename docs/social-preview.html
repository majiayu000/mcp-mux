<!doctype html>
<!-- Source for docs/social-preview.png (1280x640). Render: Chrome --headless --screenshot --window-size=1280,640 -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; background: #0d1117; color: #e6edf3; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .wrap { padding: 64px 72px; height: 100%; display: flex; flex-direction: column; }
  h1 { font-family: "SF Mono", Menlo, monospace; font-size: 84px; font-weight: 700; letter-spacing: -2px; }
  h1 span { color: #7ee787; }
  .tag { font-size: 34px; color: #c9d1d9; margin-top: 14px; }
  .sub { font-size: 22px; color: #8b949e; margin-top: 10px; }
  .diagram { display: flex; align-items: center; gap: 28px; margin-top: auto; }
  .box { border: 2px solid #30363d; border-radius: 14px; padding: 18px 22px; background: #161b22; font-size: 22px; }
  .client { color: #c9d1d9; }
  .mux { border-color: #7ee787; color: #7ee787; font-family: "SF Mono", Menlo, monospace; font-weight: 700; font-size: 26px; }
  .arrow { color: #484f58; font-size: 34px; }
  .accounts { display: flex; flex-direction: column; gap: 10px; }
  .acct { font-family: "SF Mono", Menlo, monospace; font-size: 20px; padding: 10px 16px; }
  .acct b { color: #79c0ff; font-weight: 600; }
  .acct i { color: #8b949e; font-style: normal; }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip { font-size: 18px; color: #c9d1d9; border: 1px solid #30363d; border-radius: 999px; padding: 6px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>mcp<span>-</span>mux</h1>
  <div class="tag">One MCP server, many accounts.</div>
  <div class="sub">Per-account OAuth · credentials in your keychain · runs locally</div>
  <div class="chips">
    <div class="chip">Gmail</div><div class="chip">Slack</div><div class="chip">Notion</div><div class="chip">Linear</div><div class="chip">any MCP server</div>
  </div>
  <div class="diagram">
    <div class="box client">Claude Code<br>Codex</div>
    <div class="arrow">→</div>
    <div class="box mux">mcp-mux</div>
    <div class="arrow">→</div>
    <div class="accounts">
      <div class="box acct"><b>"account": "work"</b> <i>me@corp.com</i></div>
      <div class="box acct"><b>"account": "personal"</b> <i>me@gmail.com</i></div>
      <div class="box acct"><b>"account": "client-a"</b> <i>client workspace</i></div>
    </div>
  </div>
</div>
</body>
</html>
